name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Castor fork only: the fork has no self-hosted runners, so its Linux jobs
    # run GitHub-hosted. Upstream uses ["self-hosted", "Linux", "X64",
    # "ram-ge-16g", "disk-ge-100g"]; never send this hunk upstream.
    runs-on: ubuntu-latest
    # Backstop so a stuck step (e.g. a flaky apt mirror, a hung runner) fails
    # in minutes instead of burning to GitHub's 6-hour default. Longer than
    # upstream's 30: a hosted runner has fewer cores and a colder cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

      - run: sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources && sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev python3-venv tmux
      - name: Install pinned workflow validator
        run: |
          bash scripts/ci/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          python3 -m venv "$RUNNER_TEMP/workflow-validator"
          "$RUNNER_TEMP/workflow-validator/bin/pip" install --disable-pip-version-check -r scripts/ci/requirements.txt
      - name: Validate workflow and preservation contracts
        env:
          ACTIONLINT: ${{ runner.temp }}/actionlint/actionlint
        run: |
          "$RUNNER_TEMP/workflow-validator/bin/python" scripts/ci/check_workflows.py --actionlint "$ACTIONLINT"
          "$RUNNER_TEMP/workflow-validator/bin/python" -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo install cargo-flux
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugins/marshal-opencode/package-lock.json
            plugins/marshal-pi/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
          no-cache: true
      - run: npm ci --prefix plugins/marshal-opencode
      - run: npm ci --prefix plugins/marshal-pi
      - run: npm ci --prefix plugins/marshal-prime-agent --workspaces=false --ignore-scripts
      - run: cargo flux run check
      - run: cargo flux run lint
      - run: cargo flux run test
      - name: Test native embedding-agent registration and reconnect
        run: |
          cargo build -p marshal-daemon -p marshal-shim --bins
          target_dir=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          test -x "$target_dir/debug/marshal-daemon"
          test -x "$target_dir/debug/marshal-shim"
          MARSHAL_DAEMON_BIN="$target_dir/debug/marshal-daemon" bun test \
            plugins/marshal-opencode/test/embedding-agent.test.ts \
            plugins/marshal-opencode/test/channel.test.ts \
            plugins/marshal-pi/test/embedding-agent.test.ts \
            plugins/marshal-prime-agent/test/embedding-agent.test.ts
      - name: Test simulation fixture and scoring contracts
        run: python3 -m unittest discover -s scripts/sandbox -v
      - name: Test release dispatch contract
        run: python3 scripts/test_release_dispatch_contract.py

      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

  # marshal-shim ships to Windows (ue_plugindev) as a cross-compiled
  # x86_64-pc-windows-gnu binary, but its Windows code is `#[cfg(windows)]`
  # and so is invisible to the Linux `check` job above. #19 silently
  # dropped the `windows-sys` dependency and broke the Windows build for
  # weeks because nothing in CI ever cross-compiled it. This job does, on
  # every PR, so a Windows-only break fails the check instead of the next
  # manual cross-build.
  windows-cross-check:
    # Castor fork only: GitHub-hosted, as for `check` above.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install mingw-w64 cross linker
        # Bound apt's network waits (Acquire timeouts + retries) so a flaky
        # azure.archive.ubuntu.com mirror can't hang the job indefinitely —
        # this is what stalled a release for ~2h on 2026-06-18.
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 build-essential pkg-config mingw-w64
      - name: Cross-compile the Windows shim
        run: cargo check -p marshal-shim --target x86_64-pc-windows-gnu

      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

  # Cross-compilation catches cfg(windows) build failures, but it cannot prove
  # the launcher/bridge behavior. Run the real multi-process wake canary on a
  # native Windows host as well: Windows Codex TUIs own isolated loopback
  # app-servers, so each bridge must wake only the thread its endpoint owns.
  windows-native-wake:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/ci/report_resources.py

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
      - name: Test Windows isolation recipe offline
        shell: pwsh
        run: ./scripts/ci/test_windows_isolation.ps1
      - name: Run native Windows Codex wake canary
        run: cargo test -p marshal-shim -- --nocapture

      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/ci/report_resources.py

  # MAR-14: delivery conformance. The real daemon and shim against a fake of
  # each harness, one scenario table; prints the harness × scenario grid with
  # a reason for every n/a cell. Stage 1 runs Claude Code and Codex. Its
  # restart cells persist to Postgres, so a missing database fails them here.
  # Castor fork: GitHub-hosted, as `check` is.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py
      - run: sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources && sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Delivery conformance
        env:
          CONFORMANCE_POSTGRES_URL: postgres://conformance:conformance@127.0.0.1:5432/conformance
          CONFORMANCE_REQUIRE_POSTGRES: "1"
          CONFORMANCE_GRID: ${{ runner.temp }}/conformance-grid.txt
        run: cargo build --workspace && cargo test -p marshal-shim --test conformance -- --ignored --nocapture
      - name: Show the grid
        if: always()
        run: cat "$RUNNER_TEMP/conformance-grid.txt" || true
      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

  # MAR-16: dependency audit (advisories, licences, bans and sources), as
  # configured in deny.toml, where every exception says why. Additive: it
  # gates nothing else. cargo-deny is built from crates.io at a pinned version
  # with its lockfile, so no third-party action runs.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check
