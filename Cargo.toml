[workspace]
resolver = "2"
members = ["crates/entities", "crates/daemon", "crates/shim", "crates/tui", "crates/ui"]

[workspace.package]
version = "0.49.5"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
notify-debouncer-mini = "0.7"
futures-util = "0.3"
tokio-tungstenite = "0.29"

# Myko stack. Fork only (MAR-37, operator 2026-11-09): pinned to
# ignition-is-go/myko#129 (trevorsargent's auth PR) by rev, so the fork builds
# its opt-in auth on myko's own provider. Back to crates.io once #129 is
# released; never send this hunk upstream. `version` keeps cargo-deny from
# counting the git pins as wildcards. Keep the core and code-generating
# macros on the same rev.
myko = { git = "https://github.com/ignition-is-go/myko", rev = "59db024ac95393be6faa85204ee67646d922ddad", version = "6.11.6" }
myko-macros = { git = "https://github.com/ignition-is-go/myko", rev = "59db024ac95393be6faa85204ee67646d922ddad", version = "6.11.6" }
myko-server = { git = "https://github.com/ignition-is-go/myko", rev = "59db024ac95393be6faa85204ee67646d922ddad", version = "6.11.6" }
myko-leptos = { git = "https://github.com/ignition-is-go/myko", rev = "59db024ac95393be6faa85204ee67646d922ddad", version = "6.11.6" }
hyphae = "3.1.2"

# Local crates. `version` is required so `cargo publish` accepts the
# path dep — flux stamps both this and `workspace.package.version` to
# keep them in sync. The dep key matches the published crates.io
# name so cargo-flux's workspace topology resolution works (it keys
# the cross-crate publish graph on the dep key, not the `package =`
# alias). Source code uses `use marshal_entities::...` — the auto
# dash→underscore conversion Rust applies to crate names.
marshal-entities = { path = "crates/entities", version = "0.58.1" }
