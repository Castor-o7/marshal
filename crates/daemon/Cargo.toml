[package]
name = "marshal-daemon"
version = "0.58.1"
edition.workspace = true
license.workspace = true
description = "Coordination daemon for the marshal multi-agent service. Owns the live roster and routes messages between Claude Code sessions."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "coordination", "myko", "daemon"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "daemon"

[[bin]]
name = "marshal-daemon"
path = "src/main.rs"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
myko = { workspace = true }
myko-server = { workspace = true }
hyphae = { workspace = true }
marshal-entities = { workspace = true }
notify-debouncer-mini = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true }
# myko#129's auth provider: auth::session_binding (MAR-80) is an Authorizer, and
# myko129_threat_model.rs (MAR-37) switches the provider on. Same rev as the
# workspace's myko pin; back to crates.io with it.
myko-auth = { git = "https://github.com/ignition-is-go/myko", rev = "59db024ac95393be6faa85204ee67646d922ddad", version = "6.11.6" }

[target.'cfg(unix)'.dependencies]
# controls.rs checks a control file is owned by the daemon's own user.
libc = "0.2"

[dev-dependencies]
serde_json = "1"
chrono = { workspace = true }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
hyphae = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
