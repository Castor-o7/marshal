[package]
name = "marshal-daemon"
version = "0.58.1"
edition.workspace = true
license.workspace = true
description = "Coordination daemon for the marshal multi-agent service. Owns the live roster and routes messages between Claude Code sessions."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "coordination", "myko", "daemon"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "daemon"

[[bin]]
name = "marshal-daemon"
path = "src/main.rs"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
myko = { workspace = true }
myko-server = { workspace = true }
hyphae = { workspace = true }
marshal-entities = { workspace = true }
notify-debouncer-mini = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true }
# Opt-in TLS (MAR-23), on the ring provider. rustls and tokio-rustls are already
# in the tree through myko's telemetry; ring adds about 1.9 MB to a release
# daemon (32.0 -> 33.9 MB on Linux x86-64), where the aws-lc-rs provider that
# telemetry names but doesn't link would add 4.2 MB. reqwest picks its own
# provider explicitly, so enabling ring changes nothing there. rcgen makes the
# self-signed certificate and sha2 its fingerprint.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
sha2 = "0.10"
# Per-machine pairing (MAR-24): random tokens and invite secrets, and the
# bearer-token side of myko#129's provider.
getrandom = "0.3"
base64 = "0.22"
myko-auth = { git = "https://github.com/ignition-is-go/myko", rev = "59db024ac95393be6faa85204ee67646d922ddad", version = "6.11.6" }
futures-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
# controls.rs checks a control file is owned by the daemon's own user.
libc = "0.2"

[dev-dependencies]
serde_json = "1"
chrono = { workspace = true }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
hyphae = { workspace = true }
tokio-tungstenite = { workspace = true }
